global_vals:
  n_filters_out_ini: 16
  num_blocks_default: 3


bottleneck:
  _target_: src.modelling.bottleneck.Bottleneck
  num_enc_blocks: ${global_vals.num_blocks_default}
  print_sizes: False

dualEncoder:
  _target_: src.modelling.encoder.dual_encoder.DualEncoder
  num_blocks: ${global_vals.num_blocks_default}
  n_filters_in_initial: 2
  n_filters_out_initial: ${global_vals.n_filters_out_ini}
  print_sizes: [False, False, False]

decoder:
  _target_: src.modelling.decoder.decoder.Decoder
  num_blocks: ${global_vals.num_blocks_default}
  n_filters_in: ${global_vals.n_filters_out_ini}
  n_filters_out: 16
  skip_connections: True
  print_sizes: False


build:
  encoder: ${dualEncoder}
  bridger: ${bridgers}
  bottleneck: ${bottleneck}
  decoder: ${decoder}
  printS: False
