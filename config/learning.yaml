learning_params:
  # optimizer: 
  #   _target_: torch.optim.SGD
  #   lr: 1e-2
  #   weight_decay: 3e-5
  #   momentum: 0.99
  optimizer: 
   _target_: torch.optim.AdamW
   lr: 2e-4
  #  lr: 0.01
   weight_decay: 3e-5
   betas: [0.99, 0.999]
  use_warmup: False 
  use_lr_scheduler: True
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: 1000
  warmup:
    _target_: torch.optim.lr_scheduler.LinearLR
    start_factor: 0.01
    total_iters: 5
    
  scaler:
    _target_: torch.amp.GradScaler

  loss:
    clip: 0
    alpha: 1.0
    beta: 1.0
  weight_initialiser:
    type: "kaiming"

  experiment_var:
    empty_cache: 50
    patch_size: 64
    model_name: "BriAtt-Encoder"
    n_epochs: 500
    experiment_num: 0
    val_at_iter: 58
    seed: 456
    device: "cuda"
    mode: "train"
